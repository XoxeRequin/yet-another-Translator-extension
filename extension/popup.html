<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark Translate</title>
  <style>
    :root {
      --bg: #0f1015;
      --surface: #181922;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #93c5fd;
    }
    .control-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      outline: none;
    }
    select:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #2563eb;
    }
    .output {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      min-height: 48px;
      word-break: break-word;
      display: none;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-radius: 4px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="10" fill="#1e2640"/>
      <rect x="8" y="10" width="22" height="22" rx="4" fill="#182033"/>
      <text x="14" y="26" font-size="14" font-weight="bold" fill="#93c5fd">A</text>
      <rect x="18" y="16" width="22" height="22" rx="4" fill="#3b82f6"/>
      <text x="25" y="32" font-size="14" font-weight="bold" fill="#fff">文</text>
    </svg>
    <h1>Dark Translate</h1>
  </div>

  <div class="control-group">
    <label for="targetLang">Default Target Language</label>
    <select id="targetLang">
      <option value="pt" selected>Portuguese (Português)</option>
      <option value="en">English</option>
      <option value="es">Spanish (Español)</option>
      <option value="fr">French (Français)</option>
      <option value="de">German (Deutsch)</option>
      <option value="it">Italian (Italiano)</option>
      <option value="ja">Japanese (日本語)</option>
      <option value="zh-CN">Chinese (Simplified)</option>
    </select>
  </div>

  <div class="control-group">
    <label for="quickText">Quick Translate Text</label>
    <textarea id="quickText" placeholder="Type or paste text to translate..."></textarea>
    <button class="btn" id="translateBtn">Translate</button>
  </div>

  <div id="quickOutput" class="output"></div>
  <div class="badge">Tip: Select any text on web pages to translate!</div>

  <script src="popup.js"></script>
</body>
</html>
