<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2640"/>
      <stop offset="100%" stop-color="#0f1422"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
  
  <!-- Google Translate stylized card -->
  <rect x="8" y="10" width="22" height="22" rx="6" fill="#182033" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
  <!-- 'A' letter character -->
  <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">A</text>
  
  <!-- Overlapping Target Language Card -->
  <rect x="18" y="16" width="22" height="22" rx="6" fill="url(#accentGrad)" filter="url(#glow)"/>
  <!-- Asian/Global Script Character '文' stylized -->
  <path d="M29 21 h-8 v2 h3.2 c-0.6 1.8 -1.8 3.5 -3.2 4.6 l1.4 1.4 c1.6 -1.3 2.8 -3.2 3.5 -5.2 h1.1 c0.7 2.2 2 4.1 3.7 5.4 l1.3 -1.5 c-1.5 -1.1 -2.6 -2.6 -3.1 -4.7 h3.4 v-2 z" fill="#ffffff"/>
  <circle cx="29" cy="19.5" r="1.2" fill="#ffffff"/>
</svg>
